# an each opened PR checks that the project version has been incremented
name: version-check
on:
  pull_request:
    branches:
      - main
jobs:
  release:
    name: Check Version
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Version diff
        run: |
          # read application version head branch TODO
          HEAD_VERSION=$(grep "version=" setup.py | sed -E "s/.*version=['\"]([0-9]+\.[0-9]+\.[0-9]+)['\"].*/\1/")

          git checkout main
          MAIN_VERSION=$(grep "version=" setup.py | sed -E "s/.*version=['\"]([0-9]+\.[0-9]+\.[0-9]+)['\"].*/\1/")

          if [ "$HEAD_VERSION" = "$MAIN_VERSION" ]; then
            echo "Version not updated before merging into main"
            exit 1
          else
            echo "Great job, main version $MAIN_VERSION will become $HEAD_VERSION soon"
          fi
